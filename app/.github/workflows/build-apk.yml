name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/alefba/club
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AlefbaClub"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.alefba.club"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.alefba.club"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/Theme.Alefba"
                  android:label="باشگاه تجربه الفبا"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Alefba"
                  parent="Theme.Material3.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#F7F3EA</item>
                  <item name="android:navigationBarColor">#F7F3EA</item>

                  <item name="colorPrimary">#C9932D</item>
                  <item name="colorSecondary">#5E6F63</item>

              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/alefba/club/MainActivity.kt <<'EOF'
          package com.alefba.club

          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var content: LinearLayout

              private val cream = Color.rgb(247,243,234)
              private val gold = Color.rgb(201,147,45)
              private val dark = Color.rgb(45,45,45)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  showHome()
              }

              private fun text(
                  value: String,
                  size: Float = 16f,
                  bold: Boolean = false
              ): TextView {

                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(dark)
                      gravity = Gravity.RIGHT or Gravity.CENTER_VERTICAL
                      setPadding(20,16,20,16)

                      if (bold) {
                          setTypeface(typeface, Typeface.BOLD)
                      }
                  }
              }

              private fun card(value: String) {

                  val v = text(value)

                  v.setBackgroundColor(Color.WHITE)

                  val p = LinearLayout.LayoutParams(
                      -1,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )

                  p.setMargins(0,8,0,8)

                  content.addView(v,p)
              }

              private fun base(title: String) {

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(cream)
                      layoutDirection = LinearLayout.LAYOUT_DIRECTION_RTL
                  }

                  val header = LinearLayout(this).apply {
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(12,20,12,10)
                  }

                  header.addView(
                      text("الفبا",24f,true).apply {
                          setTextColor(gold)
                      }
                  )

                  header.addView(
                      text(title,20f,true),
                      LinearLayout.LayoutParams(0,70,1f)
                  )

                  root.addView(header)

                  val scroll = ScrollView(this)

                  content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16,4,16,8)
                      layoutDirection =
                          LinearLayout.LAYOUT_DIRECTION_RTL
                  }

                  scroll.addView(content)

                  root.addView(
                      scroll,
                      LinearLayout.LayoutParams(-1,0,1f)
                  )

                  val nav = LinearLayout(this).apply {
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.WHITE)
                      layoutDirection =
                          LinearLayout.LAYOUT_DIRECTION_RTL
                  }

                  listOf(
                      "خانه",
                      "برنامه‌ها",
                      "پروفایل",
                      "مالی"
                  ).forEach { name ->

                      val b = Button(this).apply {
                          text = name
                          isAllCaps = false
                          setTextColor(dark)
                      }

                      b.setOnClickListener {

                          when(name) {
                              "خانه" -> showHome()
                              "برنامه‌ها" -> showEvents()
                              "پروفایل" -> showProfile()
                              "مالی" -> showFinance()
                          }

                      }

                      nav.addView(
                          b,
                          LinearLayout.LayoutParams(0,64,1f)
                      )
                  }

                  root.addView(nav)

                  setContentView(root)
              }

              private fun showHome() {

                  base("خانه")

                  card(
                      "سلام 👋\n" +
                      "به باشگاه تجربه الفبا خوش آمدی."
                  )

                  card(
                      "📢 اطلاعیه جدید\n" +
                      "ثبت‌نام برنامه بعدی باشگاه آغاز شد."
                  )

                  card(
                      "🌙 شب، سکوت، کویر\n" +
                      "تجربه آسمان شب، سکوت و کویر\n" +
                      "مشاهده جزئیات ›"
                  )

                  card(
                      "⭐ وضعیت شما\n" +
                      "۳۸۰ ستاره • سطح: تجربه‌گر\n" +
                      "۷ جلسه شرکت کرده‌اید"
                  )
              }

              private fun showEvents() {

                  base("برنامه‌ها")

                  card("برنامه‌های پیش‌رو")

                  card(
                      "🌙 شب، سکوت، کویر\n" +
                      "تجربه آسمان شب و کویر"
                  )

                  card(
                      "🧠 زاویه دید\n" +
                      "جلسه گفت‌وگوی تجربه‌محور\n" +
                      "به‌زودی"
                  )
              }

              private fun showProfile() {

                  base("پروفایل من")

                  card(
                      "👤 عضو باشگاه تجربه الفبا"
                  )

                  card(
                      "⭐ ۳۸۰ ستاره\n" +
                      "سطح: تجربه‌گر\n" +
                      "تا سطح بعدی: ۲۲۰ ستاره"
                  )

                  card(
                      "🎟 ۷ جلسه شرکت کرده‌اید"
                  )

                  card(
                      "🏅 نشان‌ها\n" +
                      "کاوشگر نخستین تجربه\n" +
                      "همراه فعال"
                  )
              }

              private fun showFinance() {

                  base("امور مالی")

                  card(
                      "💳 وضعیت عضویت\n" +
                      "عضویت فعال"
                  )

                  card(
                      "مبلغ قابل پرداخت\n" +
                      "۵۰۰,۰۰۰ تومان"
                  )

                  card(
                      "سوابق پرداخت\n" +
                      "شهریور — تسویه شد\n" +
                      "مرداد — تسویه شد"
                  )
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlefbaClub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
